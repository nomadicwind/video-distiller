name: Windows Package

on:
  workflow_dispatch: {}

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # frontend/pnpm-workspace.yaml 的 allowBuilds 是 pnpm 10+ 配置字段；
          # pnpm 9 会把该文件当工作区清单并因缺 packages 字段报错（CI 实证）。
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Build frontend
        run: pnpm --dir frontend build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend and PyInstaller
        run: pip install ./backend pyinstaller==6.22.2

      - name: Run PyInstaller
        run: pyinstaller packaging/vd.spec --distpath dist-pack

      - name: Fetch ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extract
          $ffmpegDir = Get-ChildItem -Path ffmpeg-extract -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Path stage/ffmpeg -Force | Out-Null
          Copy-Item -Path (Join-Path $ffmpegDir.FullName "bin/ffmpeg.exe") -Destination stage/ffmpeg/
          Copy-Item -Path (Join-Path $ffmpegDir.FullName "bin/ffprobe.exe") -Destination stage/ffmpeg/
          Copy-Item -Path (Join-Path $ffmpegDir.FullName "LICENSE") -Destination stage/ffmpeg/

      - name: Assemble package
        shell: pwsh
        run: |
          Copy-Item -Path dist-pack/VideoDistiller -Destination stage/VideoDistiller -Recurse
          Copy-Item -Path packaging/run.bat -Destination stage/run.bat
          Copy-Item -Path packaging/使用说明.txt -Destination stage/使用说明.txt

      - name: Compress package
        shell: pwsh
        run: Compress-Archive -Path stage/* -DestinationPath VideoDistiller-win64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoDistiller-win64
          path: VideoDistiller-win64.zip
          retention-days: 14
